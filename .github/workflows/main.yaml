name: Build and Release

on:
  push:
    branches:
      - main

env:
  PLUGIN_VERSION: "2.1.4" # EDIT THIS LINE TO CREATE A NEW RELEASE

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for tag checking
          submodules: true # Needed for PlayerSettingsApi

      - name: Check if tag exists
        id: check_tag
        run: |
          # Check if a tag for the version in this workflow file already exists
          if git rev-parse "refs/tags/EntBossHP-v${{ env.PLUGIN_VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "A release for version ${{ env.PLUGIN_VERSION }} already exists. Skipping release steps."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "Creating a new release for version ${{ env.PLUGIN_VERSION }}."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Create Release Directory Structure
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: mkdir -p release/addons/counterstrikesharp/plugins/EntBossHP

      - name: Copy Files
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          cp -r ./publish/* release/addons/counterstrikesharp/plugins/EntBossHP/
          cd release/addons/counterstrikesharp/plugins/EntBossHP
          find . -maxdepth 1 -name "*.dll" ! -name "EntBossHP.dll" -delete
          find . -maxdepth 1 -name "*.pdb" ! -name "EntBossHP.pdb" -delete
          rm -rf runtimes/

      - name: Zip Release
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          cd release
          zip -r ../EntBossHP.zip .

      - name: Create Release
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "EntBossHP-v${{ env.PLUGIN_VERSION }}" --cleanup-tag -y || true
          gh release create "EntBossHP-v${{ env.PLUGIN_VERSION }}" ./EntBossHP.zip \
            --title "EntBossHP v${{ env.PLUGIN_VERSION }}" \
            --notes "Automated release for version ${{ env.PLUGIN_VERSION }}"
